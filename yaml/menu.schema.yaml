# author the schema; API, CLI & UI derive from it
apiVersion: yourcool.app/v1
kind: ConfigSchema
metadata:
  name: menus
spec:
  served: config.yourcool.app/v1/menus
  fields:
    flavours:
      type: array
      items:
        name:
          type: string
        allergens:
          type: array
          enum: [nuts, milk, soy, gluten, egg]
        price:
          type: string
          pattern: '^\d+\.\d{2}$'
        available:
          type: boolean
          default: true

# author the schema; API, CLI & UI derive from it
apiVersion: config.yourcool.app/v1
kind: ConfigSchema
metadata:
  name: featuresettings
spec:
  served: config.yourcool.app/v1/featuresettings
  fields:
    newCheckout:
      type: boolean
      default: false
    maxUploadMb:
      type: integer
      minimum: 1
      maximum: 500
    currency:
      type: string
      enum: [EUR, USD, GBP]

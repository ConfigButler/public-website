server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Behind a reverse proxy: never leak the internal scheme/host/:8080.
    absolute_redirect off;

    # /about and /about/ both serve about/index.html directly, no redirect.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Astro's hashed assets never change.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

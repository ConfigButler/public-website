name: Container image

# ghcr.io/<repo>:pr-<N> / :main (moving) and :sha-<short> (immutable, pin this).
on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    # Fork PRs get a read-only token and can't push.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # Build the PR head, not the merge commit, so sha-<short> names exactly what's inside.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_PR_HEAD_SHA: true
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=pr
            type=ref,event=branch
            type=sha,format=short

      # Push before testing, so a failing image can still be inspected.
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Test image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}@$DIGEST" tests/image.sh

      - name: Summary
        if: always() && steps.push.outputs.digest
        run: |
          {
            echo '### Image'
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo
            echo "digest: ${{ steps.push.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
